template: ../templates/changelog.hbs
schema: ../templates/changelog.cue
tmp: true
data:
  title: CloudBees changelog
  description: The CloudBees changelog lists every update to the platform.
  changelogs:
  - title: August 2025
    anchor: '2025-08-08'
    date: '2025-08-08'
    content: ''
    entries:
    - title: Approval request for feature flag changes
      release: '1.69'
      badges:
      - type: success
        text: New feature
      content: You can now introduce a structured review process before feature flag
        configuration changes go live. Approval requests enable safe collaboration
        by allowing authorized users to propose, approve, or reject configuration
        changes. This prevents unintentional edits, retains an audit trail, and ensures
        high-impact changes are reviewed before deployment. Approval flows support
        safer releases and greater control in production environments.
      version: '1.69'
    - title: Bulk delete artifact versions
      release: '1.69'
      badges:
      - type: success
        text: New feature
      content: Artifact versions can now be deleted in bulk by selecting multiple
        one then invoking delete. Only artifact versions that have not ever been deployed
        can be deleted to protect traceability.
      version: '1.69'
    - title: External Secret Management with CyberArk Conjur Integration
      release: '1.69'
      badges:
      - type: success
        text: New feature
      content: Users can now call the Conjur action to fetch secrets from external
        CyberArk Conjur secret stores and utilize them in subsequent workflow steps.
        The integration includes automatic secret masking in logs to prevent accidental
        exposure while keeping the secrets available for use in following actions.
        This introduces our first external secret management capability, enabling
        secure secret retrieval without hardcoding sensitive information in workflows.
      version: '1.69'
    - title: Release audit report
      release: '1.69'
      badges:
      - type: success
        text: New feature
      content: The audit report view provides a summary of operations performed during
        a release, including manual approvals, deployed artifacts, and evidence collected
        by the last release workflow run. This view can be downloaded as a PDF document.
      version: '1.69'
    - title: Run commit SHA link for workflows managed in GitHub
      release: '1.69'
      badges:
      - type: success
        text: New feature
      content: Access to the workflow definition commit SHA is now available from
        workflow runs for that version of the workflow. This makes it easy to view
        changes for that commit. Currently, this is available for workflows managed
        in GitHub source control.
      version: '1.69'
    - title: Improved Build and Deployment Data Display
      release: '1.69'
      badges:
      - type: info
        text: Feature enhancement
      content: Users can now call build actions directly in workflows or use build
        artifacts to display build data in VSM dashboards, eliminating the need to
        rely solely on Step:Kind information. Similarly, deploy artifacts can now
        be used to automatically populate deployment data in VSM dashboards instead
        of Step:Kind metadata. This enhancement provides more accurate tracking and
        simplified workflow configuration while delivering richer insights for your
        software delivery analytics.
      version: '1.69'
    - title: Fixed default value for input parameters of type String
      release: '1.69'
      badges:
      - type: warning
        text: Resolved issues
      content: Fixed an error causing the default value of String input parameter
        to be "nil" instead of "".
      version: '1.69'
    - title: Fixed issue on action repository resolution
      release: '1.69'
      badges:
      - type: warning
        text: Resolved issues
      content: 'Fixed an issue on action repository resolution. Short repository format
        exclusively resolves to Github Saas full repository url. Customers hosting
        their own actions in a SCM provider other than Github must always refer to
        them using the full repository url. Updated documentation: XXXX.'
      version: '1.69'
